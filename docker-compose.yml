version: '3.9'
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: retail_arbitrage
    ports: ['5432:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports: ['6379:6379']

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/retail_arbitrage
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: dev
      DEBUG: 'true'
    ports: ['8000:8000']
    depends_on: [postgres, redis]

  frontend:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    ports: ['3000:3000']
    depends_on: [backend]

volumes:
  pgdata:
